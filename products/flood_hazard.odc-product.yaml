# Flood hazard for Indonesia (Bahaya Banjir 2025).
# Derived from a Modified Geomorphic Flood Index over FABDEM v1.2 with BMKG
# design rainfall. Single 2025 epoch.
---
name: flood_hazard
description: Flood hazard (Bahaya Banjir 2025) for 2, 5, 10, 25 and 50-year return periods.
metadata_type: eo3
metadata:
  product:
    name: flood_hazard
storage:
  crs: EPSG:6933
  resolution:
    x: 30
    y: -30
measurements:
  - name: flood_depth_rp02
    units: metre
    dtype: float32
    nodata: .nan
  - name: flood_hazard_index_rp02
    units: "1"
    dtype: float32
    nodata: .nan
  - name: flood_hazard_class_rp02
    units: "1"
    dtype: uint8
    nodata: 255
    flags_definition:
      hazard:
        description: Flood hazard class
        bits: [0, 1, 2, 3, 4, 5, 6, 7]
        values:
          1: low
          2: moderate
          3: high
